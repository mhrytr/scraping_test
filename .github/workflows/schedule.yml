name: Auto Scraping

on:
  schedule:
    # 15分ごとに実行
    - cron: '*/15 * * * *'
  workflow_dispatch: # 手動でテスト実行するためのボタンを表示

permissions:
  contents: write

jobs:
  run-scraping:
    runs-on: ubuntu-latest

    steps:
    - name: リポジトリのコードを取得
      uses: actions/checkout@v4  # ← v3からv4（最新）に更新！

    - name: Pythonの準備
      uses: actions/setup-python@v5  # ← v4からv5（最新）に更新！
      with:
        python-version: '3.x'

    - name: 必要なライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: プログラムの実行
      run: python fetch_data.py

    - name: 取得したCSVデータを保存（上書き）
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add .  # ← どの名前のCSVファイルができても全て保存するように変更
        git commit -m "自動取得データを更新" || echo "変更なし"
        git push
